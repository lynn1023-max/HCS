<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COURTSIDE · 篮球拍摄集群</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1019;color:#edf3ff;font:14px system-ui}header,main{max-width:1510px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #263247}small,.muted{color:#9baec7}h1{margin:5px 0;font-size:28px}h2{font-size:16px;margin:0 0 12px}.accent{color:#6ef2cf;letter-spacing:2px}.layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,1fr);gap:14px}.panel{background:#121c2c;border:1px solid #263650;border-radius:14px;padding:14px;margin-bottom:14px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}button,select{background:#1d2b40;color:#eef5ff;border:1px solid #40516a;border-radius:7px;padding:7px 10px;cursor:pointer}button.on{border-color:#6ef2cf;color:#6ef2cf}canvas{width:100%;display:block;background:#0d1523;border-radius:8px;aspect-ratio:16/9}#feeds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#feeds button{text-align:left;padding:5px}#feeds span{display:block;padding:5px}input[type=range]{width:100%;accent-color:#6ef2cf}label{display:block;margin:10px 0}.metric{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #29394f}#events{display:flex;flex-wrap:wrap;gap:5px}#log{max-height:200px;overflow:auto;padding-left:20px;line-height:1.75}@media(max-width:800px){.layout{grid-template-columns:1fr}header,main{padding:12px}}
#scene.orbit{cursor:grab;touch-action:none}#scene.orbit.dragging{cursor:grabbing}#orbitTools{margin-top:10px}#orbitTools small{margin-right:10px}</style>
<header><div><small class="accent">COURTSIDE / SIMULATION LAB</small><h1>篮球拍摄集群</h1><small>异构机位协同 · 场外机位布置 · 导播回放</small></div><div id="score"></div></header>
<main class="layout"><section>
<div class="panel"><div class="bar"><h2 id="viewTitle">球馆总览</h2><div><button id="wide" class="on">球馆总览</button> <button id="program">导播输出</button></div></div><canvas id="scene" width="1120" height="630" aria-label="球馆三维视图，方向键旋转，加减键缩放" tabindex="0"></canvas><div id="orbitTools"><small>拖拽旋转 · 滚轮缩放</small><button id="topView">俯视</button> <button id="resetView">重置视角</button></div></div>
<div class="panel"><div class="bar"><h2>同步机位</h2><small>点击查看设备遥测</small></div><div id="feeds"></div></div>
<div class="panel"><div class="bar"><div><button id="play">播放</button> <button id="reset">复位</button> <select id="speed" aria-label="播放速度"><option>1</option><option>2</option><option>4</option></select> ×</div><strong id="clock"></strong></div><input id="seek" aria-label="回放时间轴" type="range" min="0" max="3600" value="0"><div id="events"></div></div>
</section><aside>
<div class="panel"><h2>任务与遥测</h2><div id="telemetry"></div></div>
<div class="panel"><h2>仿真干预</h2><label><input id="edit" type="checkbox"> 允许写入时间轴</label><fieldset id="controls" disabled><label>移动底盘速度上限 <output id="speedVal"></output><input id="limit" type="range" min="0.5" max="6" step="0.5" value="4"></label><label>跟踪置信度阈值 <output id="thresholdVal"></output><input id="threshold" type="range" min="0" max="0.95" step="0.05" value="0.55"></label><label><input id="occlusion" type="checkbox"> 轮式机位遮挡</label><label><input id="offline" type="checkbox"> 云台信号中断</label><label><input id="stop" type="checkbox"> 移动底盘急停</label></fieldset><small>干预从当前帧生效，回退后可重放。修改过去会覆盖其后的干预。</small></div>
<div class="panel"><h2>导播事件</h2><ol id="log"></ol></div>
</aside></main><script src="sim.js"></script></html>
